name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # One Gradle run, so the daemon starts and the build is configured once. It covers the deterministic JVM +
      # Robolectric suite (safety drills, desktop conduct, accessibility, Laws of UX, manifest conformance and
      # Constitution traceability, Article XVI), Android Lint with warnings as errors, detekt, and the shrunk (R8) release
      # builds of both distribution flavors (github, play) without signing: only assemble/bundle/package tasks need the upload key, so a bad keep rule fails here
      # and not in a Play upload.
      - name: Tests, lint, static analysis and release shrink
        # gradle.properties keeps the heaps small for the low-memory dev box; the hosted runner has room, and the Kotlin
        # compiler daemon (512 MB there) runs out of memory on this codebase, so CI raises the limits on the command line.
        run: >
          ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest lintGithubDebug lintPlayDebug detekt
          :app:minifyGithubReleaseWithR8 :app:minifyPlayReleaseWithR8 :app:lintGithubRelease :app:lintPlayRelease --stacktrace
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs="-Xmx3g"

      # Per-package line-coverage floors (app/coverage-floors.csv). CI-only: the aarch64 dev box skips the real-SQLite
      # and WorkManager tests, so local coverage sits below what this runner measures. Floors only ratchet upward.
      - name: Coverage floors
        run: ./gradlew :app:coverageFloors -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs="-Xmx3g"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testGithubDebugUnitTest
            app/build/reports/tests/testPlayDebugUnitTest
            app/build/reports/lint-results-githubDebug.html
            app/build/reports/lint-results-playDebug.html
            app/build/reports/jacoco/jacocoTestReport/html
            build/reports/detekt
            app/build/reports/detekt
          if-no-files-found: ignore
