name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # One Gradle run, so the daemon starts and the build is configured once. It covers the deterministic JVM +
      # Robolectric suite (safety drills, desktop conduct, accessibility, Laws of UX, manifest conformance and
      # Constitution traceability, Article XVI), Android Lint with warnings as errors, detekt, and the shrunk (R8) release
      # build without signing: only assemble/bundle/package tasks need the upload key, so a bad keep rule fails here
      # and not in a Play upload.
      - name: Tests, lint, static analysis and release shrink
        run: ./gradlew testDebugUnitTest lintDebug detekt :app:minifyReleaseWithR8 :app:lintRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            build/reports/detekt
            app/build/reports/detekt
          if-no-files-found: ignore
