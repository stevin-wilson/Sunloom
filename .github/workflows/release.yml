name: Release

# Builds, signs and drafts a GitHub release for the github flavor (Constitution Article XVII).
#
#   * Push a tag such as v2.0.0 or v2.0.0-rc.1: runs in the protected `release` environment (manual approval,
#     real signing key). Release candidates become pre-releases.
#   * Manual run (workflow_dispatch) with a tag name: no environment; uses repo-level secrets. This is how the
#     pipeline is exercised with a throwaway key before the repository goes public (see docs/RELEASING.md).
#
# The result is always a DRAFT: nothing is visible to users until you publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v2.0.0-rc.1 (the commit is the one this run is started on)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'push' && 'release' || null }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from the tag
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release_version.py "$TAG" | tee -a "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SUNLOOM_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::SUNLOOM_UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SUNLOOM_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          SUNLOOM_UPLOAD_STORE_PASSWORD: ${{ secrets.SUNLOOM_UPLOAD_STORE_PASSWORD }}
          SUNLOOM_UPLOAD_KEY_ALIAS: ${{ secrets.SUNLOOM_UPLOAD_KEY_ALIAS }}
          SUNLOOM_UPLOAD_KEY_PASSWORD: ${{ secrets.SUNLOOM_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleGithubRelease --stacktrace
          -Psunloom.versionName="$versionName" -Psunloom.versionCode="$versionCode"
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs="-Xmx3g"

      - name: Name, verify and checksum the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/Sunloom-github-release.apk "dist/Sunloom-${versionName}-github.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          grep -q "\"versionCode\": ${versionCode}," app/build/outputs/apk/github/release/output-metadata.json
          grep -q "\"versionName\": \"${versionName}\"" app/build/outputs/apk/github/release/output-metadata.json
          "$APKSIGNER" verify --verbose --print-certs "dist/Sunloom-${versionName}-github.apk" | tee dist/signing-report.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/signing-report.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' dist/signing-report.txt
          (cd dist && sha256sum "Sunloom-${versionName}-github.apk" > SHA256SUMS && cat SHA256SUMS)
          rm -f "$RUNNER_TEMP/upload.jks"

      # AGP 9 writes R8's mapping as partitions in mapping.prt (a zip), not a plain mapping.txt. Archive it untouched.
      - name: Keep the R8 mapping for reading crash traces
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.versionName }}
          path: app/build/outputs/mapping/githubRelease/mapping.prt
          if-no-files-found: error

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --target "$GITHUB_SHA" --title "Sunloom $versionName")
          case "$versionName" in *-rc.*) flags+=(--prerelease) ;; esac
          # Notes: the matching "## [x.y.z]" section of CHANGELOG.md when there is one, else generated from PRs.
          if [ -f CHANGELOG.md ] && awk -v v="$versionName" '
              $0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md | grep -q .; then
            awk -v v="$versionName" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > dist/notes.md
            flags+=(--notes-file dist/notes.md)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" "${flags[@]}" dist/Sunloom-*-github.apk dist/SHA256SUMS
